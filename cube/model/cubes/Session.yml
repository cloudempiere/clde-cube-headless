# GENERATED from Session.js by scripts/js2yaml.mjs
#
# Converted, NOT reviewed. Two things this cannot decide for you:
#   - access_policy is absent. Adding it is the reason to be in YAML at all,
#     but it is a security decision and has to be written deliberately.
#   - helpers (none) are EXPANDED inline, so the shared
#     abstraction is gone and edits to helpers.js no longer reach this file.
#
# Verify with `cubejs validate`, then scripts/validate.mjs. Compiling is not
# the same as returning the same numbers.

cubes:
  - name: Session
    sql: |2
      SELECT s.ad_session_id,
           0::numeric AS ad_client_id,
           s.ad_client_id AS ad_tenant_id,
           0::numeric(10,0) AS ad_org_id,
           s.isactive,
           s.created,
           s.createdby,
           s.updated,
           s.updatedby,
           substr(s.websession::text, 1, 40) AS websession,
           substr(s.remote_addr::text, 1, 60) AS remote_addr,
           substr(s.remote_host::text, 1, 120) AS remote_host,
           substr(r.name::text, 1, 60) AS rolename,
           s.logindate,
           s.ad_session_uu,
           substr(s.servername::text, 1, 80) AS servername,
           substr(c.name::text, 1, 60) AS clientname,
           substr(o.name::text, 1, 60) AS orgname,
           substr(u.name::text, 1, 60) AS loginname,
           to_char(now() - s.created::timestamp with time zone, 'HH24:MI:SS'::text) AS duration,
           s.processed,
           r.businessfunction,
           r.allowedlogininterface
       FROM ad_session s
         JOIN ad_user u ON s.createdby = u.ad_user_id
         LEFT JOIN ad_role r ON s.ad_role_id = r.ad_role_id
         JOIN ad_client c ON s.ad_client_id = c.ad_client_id
         LEFT JOIN ad_org o ON s.ad_org_id = o.ad_org_id
    title: Session
    description: All Session related information
    sql_alias: ses
    measures:
      - name: count
        title: Total Count
        sql: ad_session_id
        type: count
    dimensions:
      - name: ad_client_id
        title: Client ID
        description: Client database primary key
        sql: ad_client_id
        type: number
        public: true
      - name: ad_session_id
        title: Session ID
        description: Session primary key
        sql: ad_session_id
        type: number
        public: false
      - name: clientname
        title: Client Nane
        description: Client Name
        sql: clientname
        type: string
        public: true
      - name: servername
        title: Server Name
        description: Server name
        sql: servername
        type: string
        public: true
      - name: logindate
        title: Login Date
        description: User Login Date
        sql: logindate
        type: time
        public: true

    # Tenant isolation. IN (tenant, 0), NOT tenant alone: this is master or
    # reference data and iDempiere ships system-owned rows at ad_client_id = 0 -
    # 3,232 reference values, 37 units of measure, the system organisation. The
    # 2022 model dropped the 0 and made all of it invisible; the fact cubes use
    # tenant-only because transactional tables hold no ad_client_id = 0 rows.
    #
    # The "{ securityContext.x }" templating works ONLY in YAML. In JavaScript
    # it passes through literally and matches nothing, silently - which is why
    # these cubes had to be converted before a policy could be written.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }", "0"]
