cubes:
  - name: Bankstatement
    sql: "SELECT * FROM c_bankstatement bst"
    title: Bank Statement
    description: Bank Statement details
    sql_alias: bst
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{Bankstatement}.ad_client_id = {Client}.ad_client_id"
      - name: Bankaccount
        relationship: many_to_one
        sql: "{Bankstatement}.c_bankaccount_id = {Bankaccount}.c_bankaccount_id"
    measures:
      - name: count
        sql: c_bankstatement_id
        type: count
        drill_members:
          - statementdate
      - name: beginningbalance
        sql: beginningbalance
        type: sum
      - name: endingbalance
        sql: endingbalance
        type: sum
    dimensions:
      - name: ad_client_id
        title: Client
        sql: ad_client_id
        type: number
        public: false
      - name: c_bankstatement_id
        title: Bank Statement ID
        description: Bank Statement database primary key
        sql: c_bankstatement_id
        type: number
        primary_key: true
        public: true
      - name: updated
        title: Updated
        sql: updated
        type: time
      - name: docstatus
        sql: docstatus
        type: string
      - name: description
        sql: description
        type: string
      - name: isapproved
        sql: isapproved
        type: string
      - name: statementdate
        sql: statementdate
        type: time

    # Tenant isolation. IN (tenant, 0), NOT tenant alone: this is master or
    # reference data and iDempiere ships system-owned rows at ad_client_id = 0 -
    # 3,232 reference values, 37 units of measure, the system organisation. The
    # 2022 model dropped the 0 and made all of it invisible; the fact cubes use
    # tenant-only because transactional tables hold no ad_client_id = 0 rows.
    #
    # The "{ securityContext.x }" templating works ONLY in YAML. In JavaScript
    # it passes through literally and matches nothing, silently - which is why
    # these cubes had to be converted before a policy could be written.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }", "0"]
