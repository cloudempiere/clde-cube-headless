# GENERATED from CBank.js by scripts/js2yaml.mjs
#
# Converted, NOT reviewed. Two things this cannot decide for you:
#   - access_policy is absent. Adding it is the reason to be in YAML at all,
#     but it is a security decision and has to be written deliberately.
#   - helpers (none) are EXPANDED inline, so the shared
#     abstraction is gone and edits to helpers.js no longer reach this file.
#
# Verify with `cubejs validate`, then scripts/validate.mjs. Compiling is not
# the same as returning the same numbers.

cubes:
  - name: Bank
    sql: |2
      SELECT 
              b.ad_client_id, 
              b.c_bank_id, 
              b.updated, 
              b.description, 
              b.swiftcode, 
              b.name, b.routingno
              FROM c_bank b
              WHERE (  
                1=1 OR b.ad_client_id=0)
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
    title: Bank
    description: All Banks defined in the system
    sql_alias: ba
    measures:
      - name: count
        type: count
        drill_members:
          - name
    dimensions:
      - name: ad_client_id
        title: Client
        sql: "{CUBE}.ad_client_id"
        type: number
        public: true
      - name: c_bank_id
        title: Bank ID
        description: Banka database primary key
        sql: c_bank_id
        type: number
        primary_key: true
        public: true
      - name: updated
        title: Updated
        sql: updated
        type: time
      - name: description
        sql: description
        type: string
      - name: swiftcode
        sql: swiftcode
        type: string
      - name: name
        sql: name
        type: string
      - name: routingno
        sql: routingno
        type: string
    pre_aggregations:

    # Tenant isolation. IN (tenant, 0), NOT tenant alone: this is master or
    # reference data and iDempiere ships system-owned rows at ad_client_id = 0 -
    # 3,232 reference values, 37 units of measure, the system organisation. The
    # 2022 model dropped the 0 and made all of it invisible; the fact cubes use
    # tenant-only because transactional tables hold no ad_client_id = 0 rows.
    #
    # The "{ securityContext.x }" templating works ONLY in YAML. In JavaScript
    # it passes through literally and matches nothing, silently - which is why
    # these cubes had to be converted before a policy could be written.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }", "0"]
