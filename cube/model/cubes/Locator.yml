# GENERATED from Locator.js by scripts/js2yaml.mjs
#
# Converted, NOT reviewed. Two things this cannot decide for you:
#   - access_policy is absent. Adding it is the reason to be in YAML at all,
#     but it is a security decision and has to be written deliberately.
#   - helpers (none) are EXPANDED inline, so the shared
#     abstraction is gone and edits to helpers.js no longer reach this file.
#
# Verify with `cubejs validate`, then scripts/validate.mjs. Compiling is not
# the same as returning the same numbers.

cubes:
  - name: Warehouselayout
    sql: |2
      SELECT 
            l.ad_client_id, 
            l.ad_org_id,
            l.updated,
            l.m_locator_id, 
            l.value,
            wh.name as m_warehouse_name
            FROM m_locator l
      left join m_warehouse wh ON (l.m_warehouse_id=wh.m_warehouse_id)
      WHERE 1=1
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
    measures:
      - name: count
        type: count
        sql: m_locator_id
    dimensions:
      - name: m_locator_id
        title: Locator ID
        description: Locator database primary key
        sql: m_locator_id
        type: number
        primary_key: true
        public: true
      - name: ad_client_id
        title: Client
        sql: ad_client_id
        type: number
        public: false
      - name: m_warehouse_name
        sql: m_warehouse_name
        type: string
      - name: name
        sql: value
        type: string
    pre_aggregations:

    # TENANT ONLY - no ", 0" branch, unlike the master-data cubes.
    #
    # The IN (tenant, 0) rule exists so system-owned rows stay visible: c_uom has
    # 37, ad_ref_list 3,232. m_locator has NONE - 0 of 21,851 rows carry
    # ad_client_id = 0. Locators are exclusively tenant-owned, so admitting 0
    # here would widen the filter to match nothing.
    #
    # THIS POLICY WAS BLOCKED UNTIL NOW, and the reason is worth keeping.
    #
    # The Inventory view used to reach locator and warehouse names THROUGH this
    # cube. A row_level filter on a joined dimension does not merely hide
    # dimension rows - it drops FACT rows whose join finds no permitted match -
    # so adding this policy silently removed 651 movements from that view
    # (253,143 -> 252,492). They were not cross-tenant rows, which is what an
    # earlier revision of this comment claimed: they have NO LOCATOR AT ALL.
    # There are 0 cross-tenant locator references in the database.
    #
    # Warehouse now carries locator and warehousename on the fact, the view no
    # longer joins this cube, and the policy costs nothing.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }"]
