# TENANT FILTER ON EVERY POLICY, even though every row here is system-owned.
#
# ad_ref_list and ad_ref_list_trl carry ad_client_id = 0 on all 3,232 and 16,160
# rows respectively - there is no tenant data in them to leak, and these cubes
# were safe when they filtered on language alone.
#
# They are filtered anyway. "Safe because the data happens to be system-owned"
# is a property of today's data, not a guarantee: the moment a tenant defines its
# own reference value, every one of these cubes starts serving it to all sixteen.
# IN (tenant, 0) keeps all 3,232 rows visible today and holds if that changes.
#
# The sibling cube uom.yml made exactly this bet and lost it: it filtered on
# ad_language only, relied on queryRewrite for tenancy, and leaked 8 tenants'
# units of measure the moment that filter was removed.

# GENERATED by scripts/gen-reference-domains.mjs - do not edit by hand.
#
# One cube per iDempiere AD_Reference lookup domain. Each carries the same
# access_policy, filtering ad_language from the security context, so a fact
# cube joining any of them sees exactly one row per code - no fan-out, one
# compiled model, one rollup set, and adding a language is an INSERT.
#
# Replaces 24 inline rv_ad_reference_trl joins that hardcoded a language.
#
# The label is qualified with {CUBE}. Unqualified COALESCE(name, name_base)
# compiles and works for ONE domain at a time, then fails the moment a query
# selects labels from TWO of them - "column reference name is ambiguous" -
# because every domain subquery exposes the same two column names. Orderfacts
# joins four of these, so asking for a delivery rule and an invoice rule
# together was enough to break it.

cubes:
  # ad_reference_id 151 - used by Orderfacts, Quotefacts
  - name: DeliveryRule
    title: Delivery Rule
    sql_alias: dr151
    sql: >
      SELECT rl.ad_ref_list_id, rl.ad_client_id, rl.value, rl.name AS name_base,
             t.ad_language, t.name AS name
      FROM ad_ref_list rl
      LEFT JOIN ad_ref_list_trl t
             ON t.ad_ref_list_id = rl.ad_ref_list_id AND t.isactive = 'Y'
      WHERE rl.isactive = 'Y' AND rl.ad_reference_id = 151
    joins:
      # queryRewrite filters ad_client_id IN (tenant, 0) on every query, so a
      # cube must be reachable from Client or the filter cannot resolve.
      # Reference rows are all ad_client_id = 0, matched by the 0.
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
    dimensions:
      - name: id
        sql: "ad_ref_list_id || '-' || COALESCE(ad_language,'--')"
        type: string
        primary_key: true
      - name: value
        title: Code
        sql: value
        type: string
      - name: ad_client_id
        sql: ad_client_id
        type: number
        public: false
      - name: ad_language
        sql: ad_language
        type: string
        public: false
      - name: name
        title: Delivery Rule
        description: Translated label; falls back to the base record when no translation exists
        sql: "COALESCE({CUBE}.name, {CUBE}.name_base)"
        type: string
    measures:
      - name: count
        type: count
    access_policy: &lang_policy
      - group: tenant_user
        member_level: { includes: "*" }
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }", "0"]
            - member: ad_language
              operator: equals
              values: ["{ securityContext.ad_language }"]

