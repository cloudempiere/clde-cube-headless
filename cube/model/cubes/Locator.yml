cubes:
  - name: Warehouselayout
    sql: |2
      SELECT 
            l.ad_client_id, 
            l.ad_org_id,
            l.updated,
            l.m_locator_id, 
            l.value,
            wh.name as m_warehouse_name
            FROM m_locator l
      left join m_warehouse wh ON (l.m_warehouse_id=wh.m_warehouse_id)
      WHERE 1=1
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
    measures:
      - name: count
        type: count
        sql: m_locator_id
    dimensions:
      - name: m_locator_id
        title: Locator ID
        description: Locator database primary key
        sql: m_locator_id
        type: number
        primary_key: true
        public: true
      - name: ad_client_id
        title: Client
        sql: ad_client_id
        type: number
        public: false
      - name: m_warehouse_name
        sql: m_warehouse_name
        type: string
      - name: name
        sql: value
        type: string
    pre_aggregations:

    # NO row_level policy here, deliberately.
    #
    # Adding one removed 654 rows from the Inventory view - 253,158 -> 252,504.
    # Warehouse facts JOIN this cube, and a row_level filter on a joined
    # dimension does not just hide dimension rows, it DROPS FACT ROWS whose
    # join finds no permitted match. 624 shipment lines reference a locator
    # that is NULL or belongs to another ad_client_id, so filtering the locator
    # silently reduced a shipment count.
    #
    # It bought no security either: the facts are already tenant-scoped by
    # their own policies, and direct queries against this cube are covered by
    # the global queryRewrite.
    #
    # The 624 cross-tenant locator references are a DATA issue in iDempiere
    # worth raising separately - they are not something the semantic layer
    # should paper over by dropping rows.
