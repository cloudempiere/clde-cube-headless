        sql: ad_client_id
        type: number
        public: true
      - name: ad_org_id
        title: Org ID
        sql: ad_org_id
        type: number
        public: false
      - name: m_forecastline_id
        title: Forecast Line ID
        sql: m_forecastline_id
        type: number
        primary_key: true
        public: false
      - name: m_forecast_id
        title: Forecast ID
        sql: m_forecast_id
        type: number
