views:
  - name: Inventory
    title: Inventory & Warehouse
    description: >
      Warehouse movements with locator, product and partner context, and
      document status resolved in the user's language. Restores the six
      dimensions removed from Warehouse during migration.
    cubes:
      - join_path: Warehouse
        includes: "*"
      # Warehouselayout is deliberately NOT joined.
      #
      # It supplied [name, m_warehouse_name] here, and that join is what stopped
      # Warehouselayout from carrying an access_policy: a row_level filter on a
      # joined dimension drops FACT rows that find no permitted match, and 651
      # movements have no locator to match. Warehouse.locator and
      # Warehouse.warehousename now carry the same values off the fact itself.
      #
      # Warehouselayout remains a cube in its own right and is still queryable
      # directly; it simply no longer sits in this view's join graph.
      - join_path: Warehouse.Product
        prefix: true
        includes: [name, value]
      - join_path: Warehouse.Product.Productcategory
        prefix: true
        includes: [name]
      - join_path: Warehouse.Businesspartner
        prefix: true
        includes: [c_bpartner_name, value]
      - join_path: Warehouse.User
        prefix: true
        includes: [name]
      - join_path: Warehouse.DocumentStatus
        prefix: true
        includes: [name]
      - join_path: Warehouse.DocBaseType
        prefix: true
        includes: [name]
      # Translated document type. Warehouse.documenttype remains available and
      # is the untranslated base name; this one resolves per security-context
      # language via c_doctype_trl.
      - join_path: Warehouse.Doctype
        prefix: true
        includes: [name, docbasetype]
