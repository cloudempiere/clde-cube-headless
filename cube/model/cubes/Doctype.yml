# GENERATED from Doctype.js by scripts/js2yaml.mjs
#
# Converted, NOT reviewed. Two things this cannot decide for you:
#   - access_policy is absent. Adding it is the reason to be in YAML at all,
#     but it is a security decision and has to be written deliberately.
#   - helpers (none) are EXPANDED inline, so the shared
#     abstraction is gone and edits to helpers.js no longer reach this file.
#
# Verify with `cubejs validate`, then scripts/validate.mjs. Compiling is not
# the same as returning the same numbers.

cubes:
  - name: Doctype
    # Translated document type names, resolved per security-context language.
    #
    # c_doctype_trl holds real translations - 251 Slovak, 291 Czech, 287
    # Hungarian, 295 Spanish - and the model ignored all of them, showing the
    # English base name to every user. It matters most on the two largest
    # tenants: roughly 154,000 invoice lines since 2024 carry a doctype that HAS
    # a Slovak name and displayed the English one.
    #
    # CROSS JOIN, not the plain LEFT JOIN the reference domains use.
    #
    # That pattern works there because every ad_ref_list row has a row in every
    # language. c_doctype_trl does not: es_CO is missing 7 of 1,343. With a plain
    # LEFT JOIN plus the ad_language policy below, those 7 doctypes would simply
    # disappear for Spanish users - the same silent row loss that cost 654 rows
    # when a policy was added to Locator.
    #
    # Cross joining the languages present in the table and LEFT JOINing the
    # translation gives one row per (doctype, language) whether or not a
    # translation exists, with COALESCE falling back to the base name. Adding a
    # language stays an INSERT; nothing here hardcodes a language list.
    sql: |2
      SELECT
        dt.ad_client_id,
        dt.updated,
        dt.c_doctype_id,
        dt.docbasetype,
        dt.name AS name_base,
        l.ad_language,
        COALESCE(t.name, dt.name) AS name
      FROM c_doctype dt
      CROSS JOIN (SELECT DISTINCT ad_language FROM c_doctype_trl WHERE isactive = 'Y') l
      LEFT JOIN c_doctype_trl t
             ON t.c_doctype_id = dt.c_doctype_id
            AND t.ad_language  = l.ad_language
            AND t.isactive     = 'Y'
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
      - name: Reference
        relationship: many_to_one
        sql: "{CUBE}.DocBaseType = {Reference}.value"
    title: Document Type
    description: Document Type related information
    sql_alias: doct
    measures:
      - name: count
        title: Total Count
        sql: ad_client_id
        type: count
    dimensions:
      # Filtered by the access_policy below, never selected. Without one
      # language pinned per request this cube returns a row per doctype PER
      # LANGUAGE, and any join to it multiplies the fact by seven.
      - name: ad_language
        sql: ad_language
        type: string
        public: false
      - name: ad_client_id
        sql: ad_client_id
        type: number
        public: true
      - name: c_doctype_id
        title: DocumentType ID
        description: DocumentType database primary key
        sql: c_doctype_id
        type: number
        primary_key: true
        public: true
      # Replaces a dimension named ad_client_name, titled "Client", whose sql
      # was the DOCTYPE name and which declared a SECOND primary_key on the
      # cube. Three faults in five lines: wrong name, wrong title, and a
      # composite key Cube would have trusted.
      - name: name
        title: Document Type
        description: Document type name in the security context language, falling back to the base name where no translation exists
        sql: name
        type: string
        public: true
      - name: docbasetype
        title: Document Base Type
        description: Three-character iDempiere base type - ARI, API, ARC, APC and so on
        sql: docbasetype
        type: string
        public: true
    pre_aggregations:

    # Tenant isolation. IN (tenant, 0), NOT tenant alone: this is master or
    # reference data and iDempiere ships system-owned rows at ad_client_id = 0 -
    # 3,232 reference values, 37 units of measure, the system organisation. The
    # 2022 model dropped the 0 and made all of it invisible; the fact cubes use
    # tenant-only because transactional tables hold no ad_client_id = 0 rows.
    #
    # The "{ securityContext.x }" templating works ONLY in YAML. In JavaScript
    # it passes through literally and matches nothing, silently - which is why
    # these cubes had to be converted before a policy could be written.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }", "0"]
            # Not optional: this is what collapses the cross join back to one
            # row per doctype.
            - member: ad_language
              operator: equals
              values: ["{ securityContext.ad_language }"]
