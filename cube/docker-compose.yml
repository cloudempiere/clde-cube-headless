services:
  cube:
    # PINNED. `latest` silently changes the runtime on any pull, and this model
    # depends on behaviour specific to this version: rollup_lambda does not
    # engage, access_policy templating works only in YAML, a query past
    # build_range_start truncates instead of falling back to source, and
    # type: boolean converts iDempiere 'Y'/'N' unaided. Upgrade deliberately and
    # re-run scripts/validate.mjs each time. Note the tag carries a `v` prefix:
    # cubejs/cube:1.7.19 does not exist, cubejs/cube:v1.7.19 does.
    image: cubejs/cube:v1.7.19
    ports:
      - "4000:4000"      # REST/GraphQL API + Developer Playground
      - "15432:15432"    # Cube SQL API (Postgres wire protocol) - queries the MODEL
      - "13306:13306"   # Cube Store (MySQL wire protocol) - the MATERIALISED tables
    env_file: .env
    volumes:
      - ./model:/cube/conf/model
      - ./cube.js:/cube/conf/cube.js
      # Materialised pre-aggregations (RocksDB metastore + parquet files) live
      # here. WITHOUT this volume they sit in the container's writable layer:
      # `restart` keeps them, but `down`, `rm` or any image pull discards the
      # lot - and a full-history backfill of the seven fact rollups is hours of
      # rebuilding. Named volume so it survives container replacement.
      - cubestore-data:/cube/conf/.cubestore

volumes:
  cubestore-data:
