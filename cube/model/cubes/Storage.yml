cubes:
  - name: Storage
    sql: |2
      SELECT 
        t.ad_client_id,
        t.ad_org_id,
        t.m_transaction_id,
        l.m_warehouse_id,
        t.m_locator_id,
        t.created,
        t.updated,
        t.m_product_id,
        t.movementdate,
        t.movementqty
      FROM m_transaction t
      JOIN m_locator l ON l.m_locator_id = t.m_locator_id
      --where t.ad_client_id=11
      --WHERE 1=1 

      where t.ad_client_id=1000036 AND {FILTER_PARAMS.Storage.date.filter('t.movementdate')} AND {FILTER_PARAMS.Storage.date.filter('t.m_product_id')}

      --where t.movementdate > '2020-04-25' 
      --where t.M_Product_ID=1116440  
      --OR t.M_Product_ID=1116428
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
    title: Storage
    description: Storage Level caclulated from Material Transactions
    sql_alias: strg
    measures:
      - name: movementqty
        sql: movementqty
        type: sum
      - name: qtylocbal
        title: Qty Balance
        sql: "COALESCE (movementqty,0)"
        type: sum
        rollingWindow:
          trailing: unbounded
          offset: end
    dimensions:
      - name: ad_client_id
        title: Tenant
        sql: ad_client_id
        type: string
      - name: ad_org_id
        title: "Org/Company"
        sql: ad_org_id
        type: number
      - name: m_transaction_id
        title: Transaction ID
        sql: m_transaction_id
        type: number
        primary_key: true
      - name: movementdate
        title: Storage Date
        sql: movementdate
        type: time
        public: true
        primary_key: false
      - name: m_warehouse_id
        title: Warehouse
        sql: m_warehouse_id
        type: number
      - name: m_locator_id
        title: Locator
        sql: m_locator_id
        type: number
      - name: m_product_id
        title: Product ID
        sql: m_product_id
        type: number
    pre_aggregations:
