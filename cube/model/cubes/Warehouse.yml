cubes:
  - name: Warehouse
    sql: |2
      SELECT * from  (
        SELECT m.ad_client_id,
            m.ad_org_id,
            loc.m_warehouse_id,
            ml.m_locator_id,
            'Movement' as ad_table,
            m.M_Movement_id AS record_id,
            ml.m_movementline_uu as line_uuid,
            m.m_movement_uu as doc_uuid,    
            m.MovementDate as movementdate,
            ml.created,
            ml.updated,
            m.documentno,
            m.c_doctype_id,
            dt.name as c_doctype_name,
            dt.docbasetype,
            dt.docbasetype AS c_docbasetype_name_code,
            m.docstatus,
            m.processed,
            dt.issotrx,
            salesrep_id,
            ml.m_product_id,
            m.c_bpartner_id,
            ml.movementqty as qty,
            m.docstatus AS c_docstatus_name_code,
            '' as warehouseproces,
            m.approvedby
          FROM M_Movement m
          LEFT JOIN m_movementline ml ON m.M_Movement_id = ml.M_Movement_id
          LEFT JOIN m_locator loc ON loc.m_locator_id=ml.m_locator_id
          LEFT JOIN c_doctype dt ON dt.C_Doctype_ID = m.C_Doctype_ID

        UNION ALL
          SELECT 
            ioc.ad_client_id,
            ioc.ad_org_id,
            loc.m_warehouse_id,
            iol.m_locator_id,
            'ShipConfirm' as ad_table,
            ioc.m_inoutconfirm_id AS record_id,
            iolc.M_InOutLineConfirm_uu as line_uuid,
            ioc.M_InOutConfirm_uu as doc_uuid,
            ioc.created as movementdate,
            ioc.created,
            ioc.updated,
            ioc.documentno,
            ioc.c_doctype_id,
            dt.name as c_doctype_name,
            dt.docbasetype,
            dt.docbasetype AS c_docbasetype_name_code,
            ioc.docstatus,
            ioc.processed,
            dt.issotrx,
            ioc.salesrep_id,
            iol.m_product_id,
            io.c_bpartner_id,
            iolc.targetqty as qty,
            ioc.docstatus AS c_docstatus_name_code,
            '' as warehouseproces,
            ioc.salesrep_id as approvedby
          FROM M_InOutConfirm ioc
          LEFT JOIN M_InOutLineConfirm iolc ON ioc.M_InOutConfirm_ID = iolc.M_InOutConfirm_ID
          JOIN M_InOutLine iol ON iol.M_InOutLine_id = iolc.M_InOutLine_id
          JOIN M_InOut io ON io.M_InOut_id = iol.M_InOut_id
          LEFT JOIN m_locator loc ON loc.m_locator_id=iol.m_locator_id
          LEFT JOIN c_doctype dt ON dt.C_Doctype_ID = ioc.C_Doctype_ID

        UNION ALL
         SELECT 
            iol.ad_client_id,
            iol.ad_org_id,
            io.m_warehouse_id,
            iol.m_locator_id,
            'Shipment' as ad_table,
            iol.m_inoutline_id AS record_id,
            iol.m_inoutline_uu as line_uuid,
            io.m_inout_uu as doc_uuid, 
            iol.created as movementdate,
            iol.created,
            iol.updated,
            io.documentno,
            io.c_doctype_id,
            dt.name as c_doctype_name,
            dt.docbasetype,
            dt.docbasetype AS c_docbasetype_name_code,
            io.docstatus,
            io.processed,
            dt.issotrx,
            io.salesrep_id,
            iol.m_product_id,
            io.c_bpartner_id,
            iol.movementqty as qty,
            io.docstatus AS c_docstatus_name_code,
            '' as warehouseproces,
            io.salesrep_id as approvedby
          FROM M_InOut io
          JOIN M_InOutLine iol ON io.M_InOut_id = iol.M_InOut_id
          LEFT JOIN c_doctype dt ON dt.C_Doctype_ID = io.C_Doctype_ID

        UNION ALL
          SELECT 
            pl.ad_client_id,
            pl.ad_org_id,
            loc.m_warehouse_id,
            pl.m_locator_id,
            'Production' as ad_table,
            pl.M_ProductionLine_id AS record_id,
            pl.M_ProductionLine_uu as line_uuid,
            p.M_Production_uu as doc_uuid,    
            pl.created as movementdate,
            pl.created,
            pl.updated,
            p.documentno,
            p.c_doctype_id,
            dt.name as c_doctype_name,
            dt.docbasetype,
            dt.docbasetype AS c_docbasetype_name_code,
            p.docstatus,
            p.processed,
            dt.issotrx,
            p.salesrep_id,
            pl.m_product_id,
            p.c_bpartner_id,
            pl.movementqty as qty,
            p.docstatus AS c_docstatus_name_code,
            '' as warehouseproces,
            p.salesrep_id as approvedby
          FROM M_Production p
          JOIN M_ProductionLine pl ON p.M_Production_id = pl.M_Production_id
          LEFT JOIN m_locator loc  ON loc.m_locator_id=p.m_locator_id
          LEFT JOIN c_doctype dt ON dt.C_Doctype_ID = p.C_Doctype_ID

        UNION ALL
          SELECT 
            il.ad_client_id,
            il.ad_org_id,
            i.m_warehouse_id,
            il.m_locator_id,
            'Physical Inventory' as ad_table,
            il.M_InventoryLine_id AS record_id,
            il.M_InventoryLine_uu as line_uuid,
            i.M_Inventory_uu as doc_uuid,    
            il.created as movementdate,
            il.created,
            il.updated,
            i.documentno,
            i.c_doctype_id,
            dt.name as c_doctype_name,
            dt.docbasetype,
            dt.docbasetype AS c_docbasetype_name_code,
            i.docstatus,
            i.processed,
            dt.issotrx,
            i.salesrep_id,
            il.m_product_id,
            0 as c_bpartner_id,
            il.QtyCount as qty,
            i.docstatus AS c_docstatus_name_code,
            '' as warehouseproces,
            i.salesrep_id as approvedby
          FROM M_Inventory i
          JOIN M_InventoryLine il ON i.M_Inventory_id = il.M_Inventory_id
          LEFT JOIN m_locator loc ON loc.m_locator_id=il.m_locator_id
          LEFT JOIN c_doctype dt ON dt.C_Doctype_ID = i.C_Doctype_ID
          ) sq
          WHERE 1=1 AND {FILTER_PARAMS.Warehouse.date.filter('movementdate')}
          AND movementdate >= DATE '2000-01-01' AND movementdate < CURRENT_DATE + INTERVAL '1 year'
    title: Warehouse
    description: "All Client/Tenant related information"
    sql_alias: wms
    joins:
      # Translated document type name. The fact keeps its own untranslated
      # `documenttype` dimension - Cube 1.x forbids a cube from defining a
      # member that references another cube - so the translated name reaches
      # users through the views, prefixed as Doctype_name.
      #
      # many_to_one is safe here: Doctype is one row per doctype once its
      # access_policy pins ad_language, and every shipment and movement in the
      # database references a doctype within (tenant, 0), so nothing is dropped.
      # Checked across tenants before wiring, because the same join on Locator
      # silently removed 654 rows.
      - name: Doctype
        relationship: many_to_one
        sql: "{CUBE}.c_doctype_id = {Doctype}.c_doctype_id"
      - name: Warehouselayout
        relationship: many_to_one
        sql: "{CUBE}.m_locator_id = {Warehouselayout}.m_locator_id"
      - name: Product
        relationship: many_to_one
        sql: "{CUBE}.m_product_id = {Product}.m_product_id"
      - name: Businesspartner
        relationship: many_to_one
        sql: "{CUBE}.c_bpartner_id = {Businesspartner}.c_bpartner_id"
      - name: User
        relationship: many_to_one
        sql: "{CUBE}.salesrep_id = {User}.ad_user_id"
      - name: DocumentStatus
        relationship: many_to_one
        sql: "{CUBE}.c_docstatus_name_code = {DocumentStatus}.value"
      - name: DocBaseType
        relationship: many_to_one
        sql: "{CUBE}.c_docbasetype_name_code = {DocBaseType}.value"
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
      - name: Approver
        relationship: many_to_one
        sql: "{CUBE}.approvedby = {Approver}.ad_user_id"
    segments:
      - name: Inbound
        sql: "{CUBE}.issotrx = 'N'"
      - name: Outbound
        sql: "{CUBE}.issotrx = 'Y'"
    measures:
      - name: linecount
        title: DocumentLine Count
        sql: record_id
        type: count
      - name: doccount
        title: Document Count
        sql: doc_uuid
        type: countDistinctApprox
      - name: qty
        title: Quantity
        sql: qty
        type: sum
    dimensions:
      - name: ad_client_id
        sql: ad_client_id
        type: number
        public: false
      - name: ad_org_id
        sql: ad_org_id
        type: number
        public: false
      - name: m_warehouse_id
        title: Warehouse ID
        sql: m_warehouse_id
        type: number
        public: false
      - name: m_locator_id
        title: Locator Identifier
        sql: m_locator_id
        type: number
        public: false
      - name: uuid
        sql: uuid
        type: number
        public: false
        primary_key: true
      - name: movementdate
        title: Document Date
        sql: movementdate
        type: time
        public: true
      - name: docstatuscode
        title: Document Status Code
        sql: c_docstatus_name
        type: string
      - name: docstatus
        title: Document Status
        sql: c_docstatus_name
        type: string
      - name: processed
        title: Processed
        sql: processed
        type: boolean
      - name: direction
        title: Direction
        sql: issotrx
        type: boolean
      - name: documenttype
        title: Document Type
        sql: c_doctype_name
        type: string
      - name: c_docbasetype_name
        title: Document Base Type
        sql: c_docbasetype_name
        type: string
    # Tenant isolation stated on the cube. The "{ securityContext.x }"
    # templating works ONLY in YAML - in JavaScript it passes through literally
    # and matches nothing, silently.
    #
    # No ", 0": these are transactional facts holding no ad_client_id = 0 rows.
    # The 0 in the global queryRewrite exists for reference and master data.
    #
    # queryRewrite still applies too; both filters agree.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }"]

    pre_aggregations:
      - name: byMonth
        type: rollup
        measures:
          - Warehouse.linecount
          - Warehouse.doccount
          - Warehouse.qty
        dimensions:
          # Both tenant members, while both filters exist: queryRewrite filters
          # Client.ad_client_id and the policy above filters Warehouse.ad_client_id.
          # A rollup matches only when EVERY filtered member is one of its
          # dimensions; listing one silently sends queries to the source.
          - Client.ad_client_id
          - Warehouse.ad_client_id
        time_dimension: Warehouse.movementdate
        granularity: day
        partition_granularity: year
        build_range_start:
          sql: "SELECT DATE '2000-01-01'"
        build_range_end:
          sql: "SELECT CURRENT_DATE + INTERVAL '1 year'"
        refresh_key:
          every: "1 day"
          incremental: true
          update_window: "90 day"
