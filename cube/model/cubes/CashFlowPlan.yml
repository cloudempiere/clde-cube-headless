# GENERATED from CashFlowPlan.js by scripts/js2yaml.mjs
#
# Converted, NOT reviewed. Two things this cannot decide for you:
#   - access_policy is absent. Adding it is the reason to be in YAML at all,
#     but it is a security decision and has to be written deliberately.
#   - helpers (none) are EXPANDED inline, so the shared
#     abstraction is gone and edits to helpers.js no longer reach this file.
#
# Verify with `cubejs validate`, then scripts/validate.mjs. Compiling is not
# the same as returning the same numbers.

cubes:
  - name: Cashflowplan
    sql: |2
         SELECT cp.ad_client_id,
         cp.ad_org_id,
         sch.ad_orgonly_id,
         cp.createdby,
         cp.updatedby,
         cp.created,
         cp.updated,
         cp.isactive,
         cp.issotrx,
         cpl.c_cashplanline_id,
         cp.c_cashplan_id,
         cp.DocumentNo,
         cpl.DateTrx,
         cpl.Line,
         COALESCE(cpl.c_bpartner_id,cp.c_bpartner_id) AS c_bpartner_id,
         cpl.c_charge_id,
         CASE WHEN cp.issotrx = 'Y'::bpchar THEN cpl.linetotalamt ELSE (cpl.linetotalamt)*'-1'::INTEGER::NUMERIC END AS cashamt,
         cpl.linetotalamt AS cashamt_abs,
         cp.cashflowtype,
         cp.cashflowtype AS cashflowtype_name_code,
         i.c_invoice_id,

         ch.c_chargetype_id,
         cht.name AS c_chargetype_name,

         COALESCE(cp.c_activity_id,cpl.c_activity_id) AS c_activity_id,
         act.name as c_activity_name,   

         ev.c_elementvalue_id,
         COALESCE(cha.c_acctschema_id,pha.c_acctschema_id) AS c_acctschema_id,
         COALESCE(ch.name,p.name) AS cashflw_plan_name,

         -- MIGRATION: coalesce the CODES, not two translated labels; the single
         -- AccountType cube join resolves the label per security-context language.
         COALESCE(ev2.AccountType, ev.AccountType) AS accounttype_code,
         COALESCE (oi.C_BankAccount_ID,i.C_BankAccount_ID) as C_BankAccount_ID,
         ba.name as c_bankaccount_name,
         sch.name as c_acctschema_name,
         cpl.processed


      FROM c_cashplanline  cpl
      JOIN c_cashplan cp ON cpl.c_cashplan_id = cp.c_cashplan_id
      LEFT JOIN c_invoice i ON i.c_cashplanline_id = cpl.c_cashplanline_id

      LEFT JOIN m_product p ON cpl.m_product_id = p.m_product_id
      LEFT JOIN c_charge ch ON cpl.c_charge_id = ch.c_charge_id
      LEFT JOIN c_chargetype cht ON ch.c_chargetype_id = cht.c_chargetype_id

      LEFT JOIN c_acctschema sch ON cpl.ad_org_id = sch.ad_orgonly_id
      LEFT JOIN AD_OrgInfo oi ON oi.AD_Org_ID=sch.ad_orgonly_id
      LEFT JOIN c_bankaccount ba ON COALESCE (i.C_BankAccount_ID, oi.C_BankAccount_ID) = ba.c_bankaccount_id

      LEFT JOIN c_charge_acct cha ON cha.c_charge_id = ch.c_charge_id AND sch.c_acctschema_id = cha.c_acctschema_id
      LEFT JOIN m_product_acct pha ON pha.m_product_id = p.m_product_id AND sch.c_acctschema_id = pha.c_acctschema_id

      LEFT JOIN c_validcombination vc ON vc.c_acctschema_id = cha.c_acctschema_id AND vc.c_validcombination_id = cha.ch_expense_acct
      LEFT JOIN c_validcombination vc2 ON vc2.c_acctschema_id = pha.c_acctschema_id AND vc2.c_validcombination_id = pha.P_Revenue_Acct

      LEFT JOIN c_elementvalue ev ON vc.account_id = ev.c_elementvalue_id
      LEFT JOIN c_elementvalue ev2 ON vc2.account_id = ev2.c_elementvalue_id

      LEFT JOIN C_Activity act ON act.C_Activity_ID = COALESCE(cpl.C_Activity_ID, cp.C_Activity_ID)



      WHERE 1=1 AND cpl.isactive='Y'
      AND cpl.DateTrx >= DATE '2000-01-01' AND cpl.DateTrx < CURRENT_DATE + INTERVAL '10 years' 
      order by cpl.DateTrx ASC
    title: CashFlow
    description: Cashflow Plan related information
    sql_alias: cflw
    joins:
      - name: AccountType
        relationship: many_to_one
        sql: "{CUBE}.accounttype_code = {AccountType}.value"
      - name: CashFlowType
        relationship: many_to_one
        sql: "{CUBE}.cashflowtype_name_code = {CashFlowType}.value"
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
      - name: Organization
        relationship: one_to_many
        sql: "{CUBE}.ad_org_id = {Organization}.ad_org_id"
      - name: Businesspartner
        relationship: one_to_many
        sql: "{CUBE}.c_bpartner_id = {Businesspartner}.c_bpartner_id"
      - name: Product
        relationship: one_to_many
        sql: "{CUBE}.m_product_id = {Product}.m_product_id"
    segments:
      - name: Expenses
        sql: "{CUBE}.accounttype_code = 'E'"
      - name: Revenue
        sql: "{CUBE}.accounttype_code = 'R'"
    measures:
      - name: count
        title: Total Line Count
        sql: c_cashplanline_id
        type: count
      - name: cashamt
        title: Cash Amount
        description: "Cash Plan Amount, natural"
        sql: cashamt
        type: sum
      - name: cashin
        title: Cash Going In
        description: Cash Going In in selected period
        sql: cashamt_abs
        type: sum
        filters:
          - sql: "{CUBE}.cashamt > 0"
      - name: cashout
        title: Cash Going Out
        description: Cash Going Out in selected period
        sql: cashamt_abs
        type: sum
        filters:
          - sql: "{CUBE}.cashamt < 0"
      - name: casheffective
        title: Cash Effective
        description: Cash Period Effictive Ingoing-Outgoing
        sql: "{cashin} - {cashout}"
        type: number
      - name: balance
        sql: cashamt
        type: sum
        rollingWindow:
          trailing: unbounded
      - name: dailybalance
        sql: cashamt
        type: sum
        rollingWindow:
          trailing: unbounded
          leading: "1 day"
          offset: start
      - name: monthlysum
        sql: cashamt
        type: sum
        rollingWindow:
          trailing: "1 month"
    dimensions:
      - name: ad_client_id
        title: Tenant
        sql: ad_client_id
        type: number
        public: false
      - name: Date
        title: Date Plan
        sql: datetrx
        type: time
        public: true
      - name: c_cashplan_id
        title: Cashflow Line Identifier
        sql: c_cashplan_id
        type: number
        public: true
        primary_key: true
      - name: eventtype
        title: Cash Flow Event
        sql: cashflw_plan_name
        type: string
      - name: chargetype
        title: chargetype Name
        sql: c_chargetype_name
        type: string
      - name: activity
        title: Activity Name
        sql: c_activity_name
        type: string
      - name: accounttype
        title: Account Type
        sql: AccountType
        type: string
      - name: c_bankaccount_name
        title: Bank Account
        sql: c_bankaccount_name
        type: string
      - name: c_acctschema_name
        title: Accounting Schema
        sql: c_acctschema_name
        type: string
      - name: cashplanprocessed
        title: Cashplan Realised
        sql: processed
        type: boolean
    # Tenant isolation stated on the cube. The "{ securityContext.x }"
    # templating works ONLY in YAML - in JavaScript it passes through literally
    # and matches nothing, silently.
    #
    # No ", 0": these are transactional facts holding no ad_client_id = 0 rows.
    # The 0 in the global queryRewrite exists for reference and master data.
    #
    # queryRewrite still applies too; both filters agree.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }"]

    pre_aggregations:
      - name: byMonth
        type: rollup
        measures:
          - Cashflowplan.count
          - Cashflowplan.cashamt
          - Cashflowplan.cashin
          - Cashflowplan.cashout
        dimensions:
          # Both tenant members, while both filters exist: queryRewrite filters
          # Client.ad_client_id and the policy above filters Cashflowplan.ad_client_id.
          # A rollup matches only when EVERY filtered member is one of its
          # dimensions; listing one silently sends queries to the source.
          - Client.ad_client_id
          - Cashflowplan.ad_client_id
        time_dimension: Cashflowplan.Date
        granularity: day
        partition_granularity: year
        build_range_start:
          sql: "SELECT DATE '2000-01-01'"
        build_range_end:
          sql: "SELECT CURRENT_DATE + INTERVAL '10 years'"
        refresh_key:
          every: "1 day"
          incremental: true
          update_window: "90 day"
