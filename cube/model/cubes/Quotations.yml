# GENERATED from Quotations.js by scripts/js2yaml.mjs
#
# Converted, NOT reviewed. Two things this cannot decide for you:
#   - access_policy is absent. Adding it is the reason to be in YAML at all,
#     but it is a security decision and has to be written deliberately.
#   - helpers (none) are EXPANDED inline, so the shared
#     abstraction is gone and edits to helpers.js no longer reach this file.
#
# Verify with `cubejs validate`, then scripts/validate.mjs. Compiling is not
# the same as returning the same numbers.

cubes:
  - name: Quotefacts
    sql: |2
        SELECT 
        o.ad_client_id,
        o.ad_org_id,
        ol.updated,
        o.c_order_id,
        ol.c_orderline_id,
        o.DocumentNo,
        -- AMOUNTS ARE CONVERTED to the tenant's accounting currency; the full
      -- reasoning is in InvoiceFacts.
      --
      -- UNVERIFIED, and it cannot currently be verified. Invoices and orders
      -- each have a multi-currency tenant to test against (1000036, with six and
      -- seven currencies), so both have a reference case that would fail if the
      -- conversion were wrong. Quotations have none: NO tenant in this database
      -- quotes in more than one currency, so every quote converts 1:1 and any
      -- error here is invisible to the suite.
      --
      -- It is applied anyway, because the alternative is a model where
      -- Quotefacts.linenetamt and Orderfacts.linenetamt mean different things
      -- and nothing says so. Revisit the moment a tenant quotes in a second
      -- currency - that is when this first does arithmetic.
      --
      -- QUANTITIES are deliberately NOT wrapped - only amounts.
      currencyconvert(
      CASE
        WHEN  charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN (ol.pricelist*-1)*ol.QtyOrdered
        ELSE ol.pricelist*ol.QtyOrdered
      END,
        o.c_currency_id, acctccy.c_currency_id, o.dateacct, o.c_conversiontype_id, o.ad_client_id, o.ad_org_id
      ) AS linepricelist,
        currencyconvert(
      CASE
        WHEN  charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN ol.linenetamt*-1
        ELSE ol.linenetamt
      END,
        o.c_currency_id, acctccy.c_currency_id, o.dateacct, o.c_conversiontype_id, o.ad_client_id, o.ad_org_id
      ) AS linenetamt,
      currencyconvert(
      CASE
        WHEN  charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN ol.linetotalamt*-1
        ELSE ol.linetotalamt
      END,
        o.c_currency_id, acctccy.c_currency_id, o.dateacct, o.c_conversiontype_id, o.ad_client_id, o.ad_org_id
      ) AS linetotalamt,
      -- FIXED: the ELSE branch was missing "* ol.QtyOrdered".
      --
      -- The measure built on this is "Cogs for Line", type sum. The credit-memo
      -- branch multiplied by quantity; the normal branch did not - so the column
      -- was a LINE TOTAL on one branch and a UNIT PRICE on the other, and the
      -- measure summed whichever it got. The credit branch fires on 0 of 676,902
      -- quote lines (quotations are docsubtypeso ON/OB, never credit memos), so
      -- in practice it ALWAYS returned the unit price - and 374,510 lines, 55 per
      -- cent, have QtyOrdered <> 1.
      --
      -- Cost of goods across all quotations read 173,248,627 where it should
      -- read 202,396,942: understated by 29,148,315, or 14.4 per cent. OrderFacts
      -- has always multiplied on both branches; this makes the two agree.
      currencyconvert(
      CASE
        WHEN  charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN (ol.pricelimit*-1)*ol.QtyOrdered
        ELSE ol.pricelimit*ol.QtyOrdered
      END,
        o.c_currency_id, acctccy.c_currency_id, o.dateacct, o.c_conversiontype_id, o.ad_client_id, o.ad_org_id
      ) AS linepricelimit,
        ol.QtyOrdered as qtyquoted,
        ol.discount,
        0::numeric as markup,
        COALESCE(sr.lastname,'Empty') order_salesrep_name,
        COALESCE(cr.lastname,'Empty') as  order_custrep_name,
        COALESCE(shr.name,'Empty') as m_shippingregion,
        o.datepromised,
        o.dateordered as datequoted,
        o.dateplanship,
        o.driver_id,
        COALESCE(ords.name,'Empty') as order_source_name,
        COALESCE(stat.name,'Empty') as order_status_name,
        delrule.name as deliveryrule,
        o.priorityrule as priority,
        invrule.name as invoicerule,
        lost.name as lostsalesreason,
        linestate.name as OrderLineStatus,
        o.c_bpartner_id,
        ol.m_product_id,
        o.DropShip_BPartner_ID,
        dbp.name as dropshipname,
        COALESCE(ol.AltProductName,ch.name) AS chargename,
        COALESCE (pt.name, 'Empty') as c_paymentterm_name,
        o.docstatus,
        o.isquoteconverted
      FROM c_order o
      JOIN c_orderline ol  ON (o.c_order_id=ol.c_order_id)
      LEFT JOIN c_charge ch ON ol.c_charge_id = ch.c_charge_id
      LEFT JOIN C_PaymentTerm pt ON o.C_PaymentTerm_ID = pt.C_PaymentTerm_ID
      JOIN c_doctype dt ON o.c_doctypetarget_id = dt.c_doctype_id AND (dt.docsubtypeso::text = ANY (ARRAY['ON'::text, 'OB'::text]))
      LEFT JOIN c_bpartner dbp ON o.DropShip_BPartner_ID = dbp.c_bpartner_id
      JOIN m_warehouse wh ON (o.m_warehouse_id = wh.m_warehouse_id)
      LEFT JOIN ad_user sr ON o.salesrep_id = sr.ad_user_id
      LEFT JOIN ad_user cr ON o.customerservrep_id = cr.ad_user_id
      LEFT JOIN ad_user dr ON o.driver_id = dr.ad_user_id
      LEFT JOIN m_shipper sh ON o.m_shipper_id = sh.m_shipper_id
      LEFT JOIN c_shippingregion shr ON shr.c_shippingregion_id = o.c_shippingregion_id
      LEFT JOIN c_pos pos ON o.c_pos_id = pos.c_pos_id
      LEFT JOIN c_ordersource ords ON o.c_ordersource_id = ords.c_ordersource_id
      LEFT JOIN c_orderstatus stat ON o.c_orderstatus_id = stat.c_orderstatus_id
      LEFT JOIN w_store ws ON o.w_store_id = ws.w_store_id
      LEFT JOIN ad_ref_list lost ON ol.lostsalesreason = lost.value::bpchar AND lost.ad_reference_id = 1000188::numeric
      JOIN ad_ref_list delrule ON o.deliveryrule = delrule.value::bpchar AND delrule.ad_reference_id = 151::numeric
      JOIN ad_ref_list invrule ON o.invoicerule = invrule.value::bpchar AND invrule.ad_reference_id = 150::numeric
      LEFT JOIN ad_ref_list linestate ON ol.OrderLineStatus = linestate.value::bpchar AND linestate.ad_reference_id = 1000116::numeric
      -- Target currency, exactly one row per order. See InvoiceFacts.
      LEFT JOIN LATERAL (
        SELECT s.c_currency_id
          FROM c_acctschema s
          LEFT JOIN ad_clientinfo ci ON ci.ad_client_id = s.ad_client_id
         WHERE s.ad_client_id = o.ad_client_id
         ORDER BY (s.isactive = 'Y')                        DESC,
                  (s.ad_orgonly_id = o.ad_org_id)           DESC NULLS LAST,
                  (COALESCE(s.ad_orgonly_id, 0) = 0)        DESC,
                  (s.c_acctschema_id = ci.c_acctschema1_id) DESC,
                  s.c_acctschema_id
         LIMIT 1
      ) acctccy ON TRUE
      WHERE 1=1  AND (o.docstatus = ANY (ARRAY['CO'::text, 'CL'::text]))
      AND {FILTER_PARAMS.Quotefacts.date.filter('o.dateordered')}
      AND o.dateordered >= DATE '2000-01-01' AND o.dateordered < CURRENT_DATE + INTERVAL '1 year'
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
      - name: Organization
        relationship: many_to_one
        sql: "{CUBE}.ad_org_id = {Organization}.ad_org_id"
      - name: Businesspartner
        relationship: many_to_one
        sql: "{CUBE}.c_bpartner_id = {Businesspartner}.c_bpartner_id"
      - name: Product
        relationship: many_to_one
        sql: "{CUBE}.m_product_id = {Product}.m_product_id"
    title: Quote
    description: All Proposal and quotation related information
    sql_alias: qt
    measures:
      - name: linecount
        title: No of Quote Lines
        sql: c_orderline_id
        type: count
      - name: count
        title: Number of Quotes
        description: Number of Orders placed
        sql: c_order_id
        type: countDistinctApprox
      - name: qtyquoted
        title: Qty Ordered for the line
        sql: qtyquoted
        type: sum
      - name: linepricelimit
        title: Cogs for Line
        description: "linepricelimit (cost of goods) for line"
        sql: linepricelimit
        type: sum
      - name: linepricelist
        title: Line Total in Price List price
        sql: linepricelist
        type: sum
      - name: linenetamt
        title: Line Total excl Vat
        description: "linepricelimit (cost of goods) for line"
        sql: linenetamt
        type: sum
      - name: linetotalamt
        title: Line Total incl Vat
        sql: linetotalamt
        type: sum
      - name: marginamt
        title: Margin Amt
        description: Calculated margin amount for line
        sql: "{linenetamt} - {linepricelimit}"
        type: number
      - name: discount
        title: Discount %
        description: Calculated discount percentage for ordered items
        sql: "ROUND(COALESCE(({linepricelist} - {linenetamt}) / NULLIF({linepricelist}, 0), 0),2)*100"
        type: number
      - name: margin
        title: Margin %
        description: Calculated percentage of margin
        sql: "ROUND(COALESCE(100.0 * ({linenetamt} - {linepricelimit}) / NULLIF({linenetamt}, 0), 0),2)"
        type: number
      - name: markup
        title: Markup %
        description: Calculated percentage of markup
        sql: "ROUND(COALESCE(100.0 * ({linenetamt} - {linepricelimit}) / NULLIF({linepricelimit}, 0), 0),2)"
        type: number
      - name: fraction
        title: Fraction %
        description: Calculated fraction from Total
        sql: "ROUND(COALESCE(({linenetamt})*100 / NULLIF({linenetamt}, 0), 0),2)"
        type: number
    dimensions:
      - name: ad_client_id
        title: Tenant
        sql: ad_client_id
        type: number
        public: false
      - name: c_order_id
        title: Order
        sql: c_order_id
        type: number
        public: false
      - name: c_bpartner_id
        title: Bpartner ID
        sql: c_bpartner_id
        type: number
        public: false
      - name: c_orderline_id
        title: Order Line Identifier
        sql: c_orderline_id
        type: number
        primary_key: true
        public: false
      - name: datequoted
        title: Date Quote
        sql: datequoted
        type: time
        public: true
      - name: datepromised
        title: Date Promised
        sql: datepromised
        type: time
      - name: salesrep
        title: Sales Representative
        sql: order_salesrep_name
        type: string
      - name: deliveryrule
        title: Delivery Rule
        sql: deliveryrule
        type: string
      - name: priority
        title: Order Priority
        sql: priority
        type: string
      - name: invoicerule
        title: Invoice Rule
        sql: invoicerule
        type: string
      - name: lostsalesreason
        title: Lost Sales Reason
        sql: lostsalesreason
        type: string
      - name: c_paymentterm_name
        sql: c_paymentterm_name
        type: string
      - name: isquoteconverted
        sql: isquoteconverted
        type: boolean
      - name: yearmonth
        title: Month in Year
        sql: "TO_CHAR(datequoted,'Mon')"
        type: string
      - name: yearmonthno
        title: "Month in Year, Number"
        sql: "'Month-'||TO_CHAR(datequoted,'MM')"
        type: string
    # Tenant isolation stated on the cube. The "{ securityContext.x }"
    # templating works ONLY in YAML - in JavaScript it passes through literally
    # and matches nothing, silently.
    #
    # No ", 0": these are transactional facts holding no ad_client_id = 0 rows.
    # The 0 in the global queryRewrite exists for reference and master data.
    #
    # queryRewrite still applies too; both filters agree.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }"]

    pre_aggregations:
      - name: byMonth
        type: rollup
        measures:
          - Quotefacts.linecount
          - Quotefacts.qtyquoted
          - Quotefacts.linenetamt
          - Quotefacts.linetotalamt
        dimensions:
          # Both tenant members, while both filters exist: queryRewrite filters
          # Client.ad_client_id and the policy above filters Quotefacts.ad_client_id.
          # A rollup matches only when EVERY filtered member is one of its
          # dimensions; listing one silently sends queries to the source.
          - Client.ad_client_id
          - Quotefacts.ad_client_id
        time_dimension: Quotefacts.datequoted
        granularity: day
        partition_granularity: year
        build_range_start:
          sql: "SELECT DATE '2000-01-01'"
        build_range_end:
          sql: "SELECT CURRENT_DATE + INTERVAL '1 year'"
        refresh_key:
          every: "1 day"
          incremental: true
          update_window: "90 day"
