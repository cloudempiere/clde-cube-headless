# GENERATED from Storage.js by scripts/js2yaml.mjs
#
# Converted, NOT reviewed. Two things this cannot decide for you:
#   - access_policy is absent. Adding it is the reason to be in YAML at all,
#     but it is a security decision and has to be written deliberately.
#   - helpers (none) are EXPANDED inline, so the shared
#     abstraction is gone and edits to helpers.js no longer reach this file.
#
# Verify with `cubejs validate`, then scripts/validate.mjs. Compiling is not
# the same as returning the same numbers.

cubes:
  - name: Storage
    sql: |2
      SELECT 
        t.ad_client_id,
        t.ad_org_id,
        t.m_transaction_id,
        l.m_warehouse_id,
        t.m_locator_id,
        t.created,
        t.updated,
        t.m_product_id,
        t.movementdate,
        t.movementqty
      FROM m_transaction t
      JOIN m_locator l ON l.m_locator_id = t.m_locator_id
      -- Was: where t.ad_client_id=1000036
      --        AND <date filter on movementdate>
      --        AND <date filter on m_product_id>
      --
      -- Three faults on one line, all shipped debugging leftovers.
      --
      -- 1. A HARDCODED TENANT. Every other tenant saw an empty cube. Tenant
      --    1000026 alone has 7,579,460 m_transaction rows and this returned
      --    none of them. Tenant scoping belongs to the access_policy, not
      --    to the SQL.
      -- 2. The DATE filter applied to t.m_product_id, a product id - a
      --    copy-paste of the line before it.
      -- 3. Dead experiments alongside it: ad_client_id=11, a movementdate
      --    literal, M_Product_ID=1116440.
      WHERE 1=1 AND {FILTER_PARAMS.Storage.date.filter('t.movementdate')}
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
    title: Storage
    description: Storage Level caclulated from Material Transactions
    sql_alias: strg
    measures:
      - name: movementqty
        sql: movementqty
        type: sum
      - name: qtylocbal
        title: Qty Balance
        sql: "COALESCE (movementqty,0)"
        type: sum
        rollingWindow:
          trailing: unbounded
          offset: end
    dimensions:
      - name: ad_client_id
        title: Tenant
        sql: ad_client_id
        type: string
      - name: ad_org_id
        title: "Org/Company"
        sql: ad_org_id
        type: number
      - name: m_transaction_id
        title: Transaction ID
        sql: m_transaction_id
        type: number
        primary_key: true
      - name: movementdate
        title: Storage Date
        sql: movementdate
        type: time
        public: true
        primary_key: false
      - name: m_warehouse_id
        title: Warehouse
        sql: m_warehouse_id
        type: number
      - name: m_locator_id
        title: Locator
        sql: m_locator_id
        type: number
      - name: m_product_id
        title: Product ID
        sql: m_product_id
        type: number
    pre_aggregations:

    # Tenant isolation. IN (tenant, 0), NOT tenant alone: this is master or
    # reference data and iDempiere ships system-owned rows at ad_client_id = 0 -
    # 3,232 reference values, 37 units of measure, the system organisation. The
    # 2022 model dropped the 0 and made all of it invisible; the fact cubes use
    # tenant-only because transactional tables hold no ad_client_id = 0 rows.
    #
    # The "{ securityContext.x }" templating works ONLY in YAML. In JavaScript
    # it passes through literally and matches nothing, silently - which is why
    # these cubes had to be converted before a policy could be written.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }", "0"]
