# GENERATED from InvoiceFacts.js by scripts/js2yaml.mjs
#
# Converted, NOT reviewed. Two things this cannot decide for you:
#   - access_policy is absent. Adding it is the reason to be in YAML at all,
#     but it is a security decision and has to be written deliberately.
#   - helpers (none) are EXPANDED inline, so the shared
#     abstraction is gone and edits to helpers.js no longer reach this file.
#
# Verify with `cubejs validate`, then scripts/validate.mjs. Compiling is not
# the same as returning the same numbers.

cubes:
  - name: Invoicefacts
    sql: |2
        SELECT i.ad_client_id,
        i.ad_org_id,
        i.c_invoice_id,
        i.updated,
        i.dateinvoiced,
        il.c_invoiceline_id,
        CASE
          WHEN charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN (il.pricelist*-1)*il.QtyInvoiced
          ELSE il.pricelist*il.QtyInvoiced
        END AS linepricelist,
        -- PILOT: converted to the tenant's accounting currency.
        --
        -- Without this, amounts in different currencies are summed at face
        -- value. Tenant 1000036 invoices in six - CZK, EUR, HUF, PLN, RON, USD -
        -- and Jan-Aug 2026 reported 20,481,105 where the converted figure is
        -- 14,354,333. Overstated by 6,126,772, or 42.7%, almost entirely because
        -- 5.7M Hungarian forint were added as though they were euros.
        --
        -- The target is looked up from c_acctschema per tenant rather than
        -- hardcoded: a literal currency id would be the same defect class as the
        -- hardcoded tenant removed from Storage. All tenants examined use EUR,
        -- but that is data, not an assumption worth baking in.
        currencyconvert(
          CASE
            WHEN charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN il.linenetamt*-1
            ELSE il.linenetamt
          END,
          i.c_currency_id,
          (SELECT min(acs.c_currency_id) FROM c_acctschema acs WHERE acs.ad_client_id = i.ad_client_id),
          i.dateinvoiced, i.c_conversiontype_id, i.ad_client_id, i.ad_org_id
        ) AS linenetamt,
        CASE
          WHEN charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN il.linetotalamt*-1
          ELSE il.linetotalamt
        END AS linetotalamt,
        CASE
          WHEN charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN (il.pricelimit*-1)*il.QtyInvoiced
          ELSE il.pricelimit*il.QtyInvoiced
        END AS linepricelimit,
        CASE
          WHEN charat (dt.docbasetype::CHARACTER VARYING,3)::TEXT = 'C'::TEXT THEN il.QtyInvoiced*-1
          ELSE il.QtyInvoiced
        END AS QtyInvoiced,
        il.m_product_id,
        i.c_bpartner_id,
      i.c_bpartner_location_id,
        i.documentno,
        COALESCE(il.AltProductName,ch.name) AS chargename,
        i.salesrep_id,
        il.discount,
        COALESCE (pt.name, 'Empty') as c_paymentterm_name,
        i.docstatus,
        dt.issotrx
      FROM c_invoice i
      JOIN c_invoiceline il ON il.c_invoice_id = i.c_invoice_id
      JOIN c_doctype dt ON i.c_doctype_id = dt.c_doctype_id
      LEFT JOIN c_charge ch ON il.c_charge_id = ch.c_charge_id 
      LEFT JOIN C_PaymentTerm pt ON i.C_PaymentTerm_ID = pt.C_PaymentTerm_ID
      WHERE 1=1 AND (i.docstatus = ANY (ARRAY['CO'::text, 'CL'::text]))
      AND {FILTER_PARAMS.Invoicefacts.date.filter('i.dateinvoiced')}
      AND i.dateinvoiced >= DATE '2000-01-01' AND i.dateinvoiced < CURRENT_DATE + INTERVAL '1 year'
    title: Invoice
    description: All Sales invoice related information
    sql_alias: inv
    joins:
      - name: Bpartnerlocation
        relationship: many_to_one
        sql: "{CUBE}.c_bpartner_location_id = {Bpartnerlocation}.c_bpartner_location_id"
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
      - name: Organization
        relationship: many_to_one
        sql: "{CUBE}.ad_org_id = {Organization}.ad_org_id"
      - name: Businesspartner
        relationship: many_to_one
        sql: "{CUBE}.c_bpartner_id = {Businesspartner}.c_bpartner_id"
      - name: Product
        relationship: many_to_one
        sql: "{CUBE}.m_product_id = {Product}.m_product_id"
      - name: User
        relationship: many_to_one
        sql: "{CUBE}.salesrep_id = {User}.ad_user_id"
    measures:
      - name: linecount
        title: No of Lines
        sql: c_invoiceline_id
        type: count
      - name: count
        title: Number of Invoices
        description: Number of Invoices placed
        sql: c_invoice_id
        type: countDistinctApprox
      - name: qtyinvoiced
        title: Qty Sold
        sql: QtyInvoiced
        type: sum
      - name: linepricelimit
        title: Cost of sold goods
        description: "linepricelimit (cost of goods) for line"
        sql: linepricelimit
        type: sum
      - name: linepricelist
        title: Line Total in Price List price
        sql: linepricelist
        type: sum
      - name: linenetamt
        title: Line Total excl Vat
        description: "linepricelimit (cost of goods) for line"
        sql: linenetamt
        type: sum
      - name: linetotalamt
        title: Line Total incl Vat
        sql: linetotalamt
        type: sum
      - name: marginamt
        title: Margin Amt
        description: Calculated margin amount for line
        sql: "{linenetamt} - {linepricelimit}"
        type: number
      - name: discount
        title: Discount %
        description: Calculated discount percentage for ordered items
        sql: "ROUND(COALESCE(({linepricelist} - {linenetamt}) / NULLIF({linepricelist}, 0), 0),2)*100"
        type: number
      - name: margin
        title: Margin %
        description: Calculated percentage of margin
        sql: "ROUND(COALESCE(100.0 * ({linenetamt} - {linepricelimit}) / NULLIF({linenetamt}, 0), 0),2)"
        type: number
      - name: markup
        title: Markup %
        description: Calculated percentage of markup
        sql: "ROUND(COALESCE(100.0 * ({linenetamt} - {linepricelimit}) / NULLIF({linepricelimit}, 0), 0),2)"
        type: number
      - name: fraction
        title: Fraction %
        description: Calculated fraction from Total
        sql: "ROUND(COALESCE(({linenetamt})*100 / NULLIF({linenetamt}, 0), 0),2)"
        type: number
    dimensions:
      - name: ad_client_id
        title: Client
        sql: ad_client_id
        type: number
        public: false
      - name: ad_org_id
        title: Org ID
        sql: ad_org_id
        type: number
        public: false
      - name: c_bpartner_id
        title: Bpartner ID
        sql: c_bpartner_id
        type: number
        public: false
      - name: m_product_id
        title: Product ID
        sql: m_product_id
        type: number
        public: false
      - name: salesrep_id
        title: SalesRep ID
        sql: salesrep_id
        type: number
        public: false
      - name: c_invoiceline_id
        title: Invoice Line Identifier
        sql: c_invoiceline_id
        type: number
        primary_key: true
        public: false
      - name: dateinvoiced
        sql: dateinvoiced
        type: time
      - name: c_paymentterm_name
        sql: c_paymentterm_name
        type: string
      - name: issotrx
        sql: issotrx
        type: boolean
    segments:
      - name: Sales
        sql: "{CUBE}.issotrx = 'Y'"
      - name: Purchase
        sql: "{CUBE}.issotrx = 'N'"
    # Tenant isolation stated on the cube. The "{ securityContext.x }"
    # templating works ONLY in YAML - in JavaScript it passes through literally
    # and matches nothing, silently.
    #
    # No ", 0": these are transactional facts holding no ad_client_id = 0 rows.
    # The 0 in the global queryRewrite exists for reference and master data.
    #
    # queryRewrite still applies too; both filters agree.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }"]

    pre_aggregations:
      - name: invoicesByMonth
        type: rollup
        measures:
          - Invoicefacts.linecount
          - Invoicefacts.linenetamt
          - Invoicefacts.linetotalamt
          - Invoicefacts.qtyinvoiced
        dimensions:
          # Both tenant members, while both filters exist: queryRewrite filters
          # Client.ad_client_id and the policy above filters Invoicefacts.ad_client_id.
          # A rollup matches only when EVERY filtered member is one of its
          # dimensions; listing one silently sends queries to the source.
          - Client.ad_client_id
          - Invoicefacts.ad_client_id
          - Invoicefacts.issotrx
        time_dimension: Invoicefacts.dateinvoiced
        granularity: day
        partition_granularity: year
        build_range_start:
          sql: "SELECT DATE '2000-01-01'"
        build_range_end:
          sql: "SELECT CURRENT_DATE + INTERVAL '1 year'"
        refresh_key:
          every: "1 day"
          incremental: true
          update_window: "90 day"
