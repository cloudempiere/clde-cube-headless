views:
  - name: Receivables
    title: Receivables
    description: >
      Open items with partner, organisation and sales-rep context, plus ageing
      bands resolved in the user's language. Restores the four dimensions
      removed from Openitem during migration - Cube 1.x forbids a member
      referencing another cube.
    cubes:
      - join_path: Openitem
        includes: "*"
      - join_path: Openitem.Organization
        prefix: true
        includes: [ad_org_name]
      - join_path: Openitem.Businesspartner
        prefix: true
        # city/region intentionally absent: Openitem does not carry
        # c_bpartner_location_id, so there is no address the document
        # actually used. Sourcing one from the partner would report an
        # arbitrary address as if it were the invoice's.
        includes: [c_bpartner_name, value]
      - join_path: Openitem.User
        prefix: true
        includes: [name]
      - join_path: Openitem.Bankaccount
        prefix: true
        includes: [name, accountno]
      - join_path: Openitem.OpenItemAging
        prefix: true
        includes: [name]
