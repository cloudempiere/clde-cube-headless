cubes:
  - name: Productcategory
    sql: |2
      SELECT * FROM m_product_category pc
        WHERE 1=1
    title: Product Category
    description: Product Categories
    sql_alias: pc
    joins:
      - name: Client
        relationship: many_to_one
        sql: "{CUBE}.ad_client_id = {Client}.ad_client_id"
    measures:
      - name: count
        type: count
        drill_members:
          - name
    dimensions:
      - name: ad_client_id
        sql: ad_client_id
        type: number
        public: false
      - name: m_product_category_id
        title: Product Category ID
        description: Product Category database primary key
        sql: m_product_category_id
        type: number
        primary_key: true
        public: true
      - name: isdefault
        sql: isdefault
        type: string
      - name: name
        sql: name
        type: string
      - name: isactive
        sql: isactive
        type: string
      - name: issummary
        sql: issummary
        type: string
      - name: isselfservice
        sql: isselfservice
        type: string
      - name: value
        sql: value
        type: string
    pre_aggregations:
      - name: main
        type: rollup
        measures:
          - count
        dimensions:
          - Client.ad_client_id
          - m_product_category_id
          - name
        refresh_key:
          every: "1 day"
        indexes:
          - name: ad_client_idx
            columns:
              - Client.ad_client_id
          - name: m_product_category_idx
            columns:
              - m_product_category_id

    # Tenant isolation. IN (tenant, 0), NOT tenant alone: this is master or
    # reference data and iDempiere ships system-owned rows at ad_client_id = 0 -
    # 3,232 reference values, 37 units of measure, the system organisation. The
    # 2022 model dropped the 0 and made all of it invisible; the fact cubes use
    # tenant-only because transactional tables hold no ad_client_id = 0 rows.
    #
    # The "{ securityContext.x }" templating works ONLY in YAML. In JavaScript
    # it passes through literally and matches nothing, silently - which is why
    # these cubes had to be converted before a policy could be written.
    access_policy:
      - group: tenant_user
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: ad_client_id
              operator: equals
              values: ["{ securityContext.ad_client_id }", "0"]
